<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Car Booking</title>
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <div id="container">
      <header>
        <h1>Book a Car</h1>
      </header>
      <main>
        <section id="form">
          <h2>Contact Us</h2>

          <form action="process.html" method="get" id="booking">
            <div class="form-row">
              <label for="contactname">Name</label>
              <input
                type="text"
                name="contactname"
                id="contactname"
                required
                autofocus
                pattern="[A-Z][a-z]+( [A-Z][a-z]+)*"
                title="Enter one or more names, each starting with a capital letter followed by at least one lowercase letter."
              >
            </div>
            <div class="form-row">
              <label for="email">Email</label>
              <input 
              type="email"
               name="email" 
               id="email"
               required
               pattern="[A-Za-z0-9.!#$%&amp;'*+/=?^_`{|}~-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+"
               title="Enter a valid email address, such as name@example.com.">
            </div>
              <fieldset class="check">
              <legend>Do you have a Driver's Licence?</legend>
              <label><input type="radio" id="yes" name="licence" value="yes"> Yes</label>
              <label><input type="radio" id="no" name="licence" value="no"> No</label>
            </fieldset>
            <div class="form-row">
              <label for="age">Age</label>
              <input
               type="number"
               name="age" 
               id="age"
                min="17"
                 max="80"
                 required
                 title="Enter your age (17 to 80).">
            </div>
            <div class="form-row">
              <label for="booking-date">Booking date</label>
              <input type="date" name="booking-date" id="booking-date" required title="Select a booking date.">
            </div>
            <div class="form-row">
              <label for="car-model">Car model</label>
              <select name="car-model" id="car-model">
                <option value="Ford Focus">Ford Focus</option>
                <option value="Hyundai Tucson">Hyundai Tucson</option>
                <option value="Toyota Rav4">Toyota Rav4</option>
                <option value="Renault Kadjar">Renault Kadjar</option>
                <option value="Nissan Qashqai">Nissan Qashqai</option>
              </select>
            </div>
            <p>
    Please provide any other details you think will be useful to us
    in the text area below (it may save us calling or emailing you,
    and help avoid delays).
  </p >

  <div class="form-row">
    <label for="details">
      More details (as much as you think we'll need!)
    </label>
    <textarea name="details" id="details" rows="5" cols="30"></textarea>
  </div>

  <button type="submit">Send Us the Info</button>
  <button type="reset">Clear the Info</button>

            
          </form>
        </section>
        <section id="image">
          <figure>
            <img src="images/car.jfif" alt="Car" class="ui fluid image">
            <figcaption>Car Rental</figcaption>
          </figure>
        </section>
      </main>
    </div>
  </body>
</html>
